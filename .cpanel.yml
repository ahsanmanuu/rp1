---
deployment:
  tasks:
    - export DEPLOYPATH=${DEPLOYPATH:-/home/$(whoami)/latexify}
    - /bin/cp -R . "$DEPLOYPATH"
    - /bin/cp .htaccess /home/$(whoami)/public_html/.htaccess 2>/dev/null || true
    - /bin/cp index.html /home/$(whoami)/public_html/index.html 2>/dev/null || true
    - touch "$DEPLOYPATH/tmp/restart.txt"



