name: Build Standalone (off-box)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standalone:
    name: Build standalone + prepare artifact
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          CHECKPOINT_DISABLE: 1
          PRISMA_TELEMETRY_DISABLE: 1
          PRISMA_GENERATE_FORCE_INLINE: 1
        run: npx prisma generate

      - name: Fix Prisma exports
        run: node scripts/fix-prisma-exports.js

      - name: Build standalone (webpack)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DISABLE_ESLINT_PLUGIN: true
        run: node --max-old-space-size=8192 node_modules/next/dist/bin/next build --webpack

      - name: Assemble deployable artifact
        run: |
          set -euo pipefail
          # standalone output must carry static + public so the server has
          # everything without a build step (start.js also copies them, but
          # defensively bundle here so the deployed .next is self-contained).
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf latexify-next.tar.gz -C .next/standalone .
          echo "Artifact size:"
          du -h latexify-next.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: latexify-standalone
          path: latexify-next.tar.gz
          retention-days: 7